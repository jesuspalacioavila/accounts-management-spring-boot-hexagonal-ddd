# =============================================
# Spring Boot
# =============================================
spring.application.name=cuentas
server.port=${PORT:8081}

# DataSource se configura manualmente con @Configuration (igual que en users)
spring.autoconfigure.exclude[0]=org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration

# =============================================
# Configuracion de Base de Datos MySQL
# =============================================
db.host=${DB_HOST:localhost}
db.port=${DB_PORT:3306}
db.name=${DB_NAME:cuentas_db}
db.username=${DB_USERNAME:root}
db.password=${DB_PASSWORD:}
db.ssl-mode=${DB_SSL_MODE:DISABLED}

spring.sql.init.mode=always

# Eventos (log = simulado en consola, kafka = real)
events.publisher=${EVENTS_PUBLISHER:log}

# Kafka (solo se usa si events.publisher=kafka)
kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
kafka.security-protocol=${KAFKA_SECURITY_PROTOCOL:SASL_SSL}
kafka.sasl.mechanism=${KAFKA_SASL_MECHANISM:SCRAM-SHA-256}
kafka.sasl.username=${KAFKA_SASL_USERNAME:}
kafka.sasl.password=${KAFKA_SASL_PASSWORD:}
kafka.ssl.ca-path=${KAFKA_CA_PATH:}
kafka.ssl.ca-pem=${KAFKA_CA_PEM:}
kafka.topic.accounts=${KAFKA_TOPIC_ACCOUNTS:accounts.events}